# Test pipeline. Until this existed the repo had no test workflow at all --
# `release.yml` runs no tests -- so nothing in the suite guarded a shared
# branch, and v0.2.0 shipped on a locally-run gate.
#
# pyright is deliberately NOT in this gate. `pyright src` currently reports 36
# pre-existing errors (ca/pv.py, threads.py, theming/, log_buffer.py), all of
# them older than this workflow. Adding it now would make the gate red on
# arrival and train everyone to ignore it. Fix those, then add the step.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries
        # PySide6 ships no system deps. Without these the run dies before a
        # single test: pytest-qt imports QtGui at configure time and the whole
        # session ends in INTERNALERROR -- ImportError: libEGL.so.1.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0             libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Test
        # The Qt suite needs an X server on a headless runner; pytest-qt fails
        # at import without one.
        run: xvfb-run -a python -m pytest
