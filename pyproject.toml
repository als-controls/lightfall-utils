[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lightfall-utils"
description = "Shared Qt/EPICS infrastructure for ALS control applications: managed threading, loguru logging, semantic theming, layered config, and a caproto/Qt bridge"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md", "LEGAL.md"]
requires-python = ">=3.11"
authors = [{ name = "ALS Controls Team" }]
dynamic = ["version"]
dependencies = [
    # PySide6 6.12.0 drops a reference to None/True on every void-returning call and
    # signal emit (PYSIDE-3486, PYSIDE-3474). Harmless on Python 3.12+ (immortal
    # singletons); on 3.11 Python aborts after a few thousand calls.
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    "loguru>=0.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "nats-py>=2.1",
]

[project.optional-dependencies]
ca = ["caproto>=1.1"]
local-nats = ["nats-server-bin>=2.14"]
# netifaces-plus (maintained drop-in fork of the abandoned, sdist-only netifaces; same `netifaces` module, wheels for
# Windows and macOS arm64) enables caproto multi-homed interface enumeration; caproto degrades gracefully without it
multihomed = ["netifaces-plus>=0.12.5"]
dev = [
    "caproto>=1.1",
    "nats-server-bin>=2.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-qt>=4.2",
    "ruff>=0.1",
    "pyright>=1.1",
]
docs = [
    "sphinx>=7.0,<9.0",
    "myst-parser>=2.0",
    "sphinx-immaterial>=0.12",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/lightfall_utils/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lightfall_utils"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lightfall_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
qt_api = "pyside6"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
